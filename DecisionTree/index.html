<!DOCTYPE html>
<html lang="en">
	<head>
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta charset="utf-8">
		<title>Decision Tree</title>
		<script src="analysis.js"></script>
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.4.6/angular.min.js"></script>
		<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.5/js/bootstrap.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/angular-ui-bootstrap/0.13.4/ui-bootstrap-tpls.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-polyfill/7.7.0/polyfill.js"></script>
		<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.5/css/bootstrap.min.css" />
		<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.5/css/bootstrap-theme.min.css" />
	</head>
	<body ng-app="app" ng-controller="Ctrl as vm">
	<nav class="navbar navbar-default">
	    <div class="container-fluid">
	        <!-- Brand and toggle get grouped for better mobile display -->
	        <div class="navbar-header">
	            <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#bs-example-navbar-collapse-1" aria-expanded="false">
	                <span class="sr-only">Toggle navigation</span>
	                <span class="icon-bar"></span>
	                <span class="icon-bar"></span>
	                <span class="icon-bar"></span>
	            </button>
	        </div>

	        <!-- Collect the nav links, forms, and other content for toggling -->
	        <div class="collapse navbar-collapse" id="bs-example-navbar-collapse-1">
	            <ul class="nav navbar-nav">
	                <li><a href="#" ng-click="vm.NewTree()"><span class="glyphicon glyphicon-file" aria-hidden="true"></span> New</a></li>
	                <li><a href="#" ng-click="vm.LoadFile($event)"><span class="glyphicon glyphicon-folder-open" aria-hidden="true"></span> Load</a></li>
	                <li><a href="#" ng-click="vm.SaveFile($event)"><span class="glyphicon glyphicon-floppy-save" aria-hidden="true"></span> Save</a></li>
	                <li><a href="#" ng-click="vm.ExportImage($event)"><span class="glyphicon glyphicon-picture" aria-hidden="true"></span> Export Image</a></li>
	                <li><a href="#" ng-click="vm.DisplaySettings()"><span class="glyphicon glyphicon-cog" aria-hidden="true"></span> Display Settings</a></li>
					<li><a href="#" ng-click="vm.RiskProfile()"><span class="glyphicon glyphicon-ok" aria-hidden="true"></span> Risk Profile</a></li>
	            </ul>
	        </div><!-- /.navbar-collapse -->
	    </div><!-- /.container-fluid -->
	</nav>
    <p class="text-muted" style="margin: 0 15px">⚠ Red outlines indicate invalid or incomplete branches; hover or click a node for details.
        Bold branches have higher EV and a dominant risk profile; × marks dominated alternatives.</p>
    <div id="container"></div>
	
	<script type="text/ng-template" id="myModalContent.html">
        <div class="modal-header">
            <h3 class="modal-title">Edit Node</h3>
        </div>
        <div class="modal-body">
			<div class="alert alert-warning" ng-if="vm.issues().length" role="alert">
				<ul><li ng-repeat="issue in vm.issues() track by $index">{{issue}}</li></ul>
			</div>
			<div class="form-group">
				<label>Node Name</label>
				<input type="text" class="form-control" placeholder="Name" ng-model="vm.currNode.data.name" />
			</div>

			<div class="form-group" ng-show="!vm.currNode.data.TreeStyle">
				<label>Type</label>
				<select ng-model="vm.currNode.data.Type" class="form-control">
					<option value="d" ng-selected="vm.currNode.data.Type=='d'" ng-if="(vm.currNode.children&&(vm.currNode.children.length>0))">Decision</option>
					<option value="c" ng-selected="vm.currNode.data.Type=='c'" ng-if="(vm.currNode.children&&(vm.currNode.children.length>0))">Chance</option>
					<option value="e" ng-selected="vm.currNode.data.Type=='e'" ng-if="!(vm.currNode.children&&(vm.currNode.children.length>0))">End</option>
				</select>
			</div>

			<div class="form-group" ng-show="vm.currNode.parent && vm.currNode.parent.data.Type=='c'">
				<label>Probability</label>
				<input type="number" min="0" max="1" step="any" class="form-control" placeholder="Probability" ng-model="vm.currNode.data.Probability" />
				<p class="help-block">Use 0 to 1. Probabilities under the same chance node must total 1.</p>
			</div>

			<div class="form-group" ng-show="vm.currNode.data.Type=='e'">
				<label>Value</label>
				<input type="number" step="any" class="form-control" placeholder="Value" ng-model="vm.currNode.data.ExpVal" />
			</div>
        </div>
        <div class="modal-footer">
			<span class="pull-left">
				<button class="btn btn-primary" ng-click="vm.AddChild()">Add Child Node</button>
				<button class="btn btn-default" ng-click="vm.DeleteNode()">Delete Node</button>
			</span>
            <button class="btn btn-primary" type="button" ng-click="vm.ok()">OK</button>
            <button class="btn btn-warning" type="button" ng-click="vm.cancel()">Cancel</button>
        </div>
    </script>

	<script type="text/ng-template" id="displaySettings.html">
        <div class="modal-header">
            <h3 class="modal-title">Display Settings</h3>
        </div>
        <div class="modal-body">

			<div class="form-group">
				<label>Line Type</label>
				<select ng-model="vm.currNode.LineStyle" class="form-control">
					<option value="a" ng-selected="vm.currNode.LineStyle=='a'">Angle</option>
					<option value="s" ng-selected="vm.currNode.LineStyle=='s'">Square</option>
					<option value="c" ng-selected="vm.currNode.LineStyle=='c'">Curve</option>
				</select>
			</div>
			
			<div class="form-group">
				<label>Line Type</label>
				<select ng-model="vm.currNode.TreeStyle" class="form-control">
					<option value="tree" ng-selected="vm.currNode.TreeStyle=='tree'">Standard</option>
					<option value="cluster" ng-selected="vm.currNode.TreeStyle=='cluster'">Cluster (End Nodes Always Aligned)</option>
				</select>
			</div>

        </div>
        <div class="modal-footer">
            <button class="btn btn-primary" type="button" ng-click="vm.ok()">OK</button>
        </div>
    </script>

    <script type="text/ng-template" id="openFile.html">
        <div class="modal-header">
            <h3 class="modal-title">Open File</h3>
        </div>
        <div class="modal-body">

            <div class="form-group">
                <label>Select File</label>
                <input type="file" fileread="vm.uploadme">
            </div>

        </div>
        <div class="modal-footer">
            <button class="btn btn-primary" type="button" ng-click="vm.SaveFile()">OK</button>
        </div>
    </script>
	
	<script type="text/ng-template" id="riskProfile.html">
        <div class="modal-header">
            <h3 class="modal-title">Risk Profile</h3>
        </div>
        <div id="riskcontainer" class="modal-body">
            <p>Each curve represents a complete strategy, including choices at later decisions. Lower cumulative probability at a payoff threshold means less probability of an outcome at or below that value.</p>
            <div id="risklegend"></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-primary" type="button" ng-click="vm.cancel()">OK</button>
        </div>
    </script>


	<script>
	var treeData=null;
	var profileBuilder=null;
	if(localStorage&&localStorage.getItem("tree"))
	{
		treeData=JSON.parse(localStorage.getItem("tree"));
		if(!treeData[0].TreeStyle){
			treeData[0].TreeStyle="tree";
			treeData[0].LineStyle="a";
		}
	}else
	{
		treeData=[
		  {
			"TreeStyle":"tree",
			"LineStyle":"a",
			"name": "Top Level",
			"ExpVal":0,
			"parent": "null",
			"Type":"d",
			"identifier":"1",
			"children": []
		  }
		];
	}

	
	function GetLeafNodeByIdentifier(node,identifier)
	{
		if(node.identifier===identifier)
			return node;
			
		return node.children&&node.children.reduce((acc, current)=>{
			if (acc) return acc;
			return GetLeafNodeByIdentifier(current,identifier)
		}, null);
	}	
	
	
	var ctrl = function ($scope,$modal) {
		var self = this;
		self.title = 'Some title';
		$scope.$watch(function () {
			return JSON.stringify(DecisionAnalysis.analyze(treeData[0]).issues);
		}, function (issues) {
			self.validationIssues = JSON.parse(issues);
			main.RenderTree();
		});
		
		self.FindLeaf = function(){
			var leafslist=new Array();
			leafslist = DecisionAnalysis.leaves(treeData[0]);
			leafslist.sort(function(a,b){return a.ExpVal-b.ExpVal;});
			return leafslist;
		};
		
		self.Open = function (item, size) {
			self.currNode=item;
			var modalInstance = $modal.open({
			  animation: true,
			  templateUrl: 'myModalContent.html',
			  controller: 'ModalInstanceCtrl as vm',
			  size: size,
			  resolve:{currNode:function(){return self.currNode}},
			});

			modalInstance.result.then(function (selectedItem) {
			    main.SetupTree();
				main.RenderTree(self.currNode);
			}, function () {
			  
			});
		  };
		  
		  self.RiskProfile = function () {
			self.validationIssues = DecisionAnalysis.analyze(treeData[0]).issues;
			if (self.validationIssues.length) { main.RenderTree(); return; }
			var profiles, profileError;
			try { profiles = DecisionAnalysis.strategies(treeData[0]); }
			catch (error) { profileError = error.message; }
			var modalInstance = $modal.open({
			  animation: true,
			  templateUrl: 'riskProfile.html',
			  controller: 'ModalInstanceCtrl as vm',
			  size:'lg',
			  resolve:{currNode:function(){return self.currNode}},
			});
			
			modalInstance.rendered.then(function(){
				if (profileError) d3.select('#risklegend').append('p').attr('role', 'alert').text(profileError);
				else self.RenderRiskProfile(profiles);
			});
		  };
		  
		  self.RenderRiskProfile = function(profiles) {
            const width = 1024, height = 550;
            const margin = { top: 40, right: 30, bottom: 55, left: 65 };
            const extent = d3.extent(profiles.flatMap(s => s.points.map(p => p.value)));
            const padding = (extent[1] - extent[0]) * .05 || Math.max(1, Math.abs(extent[0]) * .05);
            const domain = [extent[0] - padding, extent[1] + padding];
            const x = d3.scaleLinear().domain(domain).range([margin.left, width - margin.right]);
            const y = d3.scaleLinear().domain([0, 1]).range([height - margin.bottom, margin.top]);
            const colour = d3.scaleOrdinal(d3.schemeTableau10).domain(profiles.map(s => s.id));
            const svg = d3.select('#riskcontainer').append('svg')
                .attr('viewBox', [0, 0, width, height]).attr('width', width)
                .attr('style', 'max-width:100%;height:auto').attr('role', 'img')
                .attr('aria-label', 'Cumulative payoff distributions by strategy');
            svg.append('g').attr('transform', 'translate(0,' + (height - margin.bottom) + ')').call(d3.axisBottom(x));
            svg.append('g').attr('transform', 'translate(' + margin.left + ',0)').call(d3.axisLeft(y).ticks(10));
            svg.append('text').attr('x', margin.left).attr('y', 20).text('Cumulative probability');
            svg.append('text').attr('x', width / 2).attr('y', height - 10).text('Payoff');
            const line = d3.line().x(p => x(p.value)).y(p => y(p.probability)).curve(d3.curveStepAfter);
            profiles.forEach(function (strategy, index) {
                const points = [{ value: domain[0], probability: 0 }].concat(strategy.points, [{ value: domain[1], probability: 1 }]);
                const dash = index < 10 ? null : (2 + Math.floor(index / 10)) + ',3';
                svg.append('path').attr('class', 'strategy-curve').attr('fill', 'none')
                    .attr('stroke', colour(strategy.id)).attr('stroke-width', 2).attr('stroke-dasharray', dash)
                    .attr('d', line(points)).append('title').text(strategy.label + ' — EV ' + strategy.ev);
                const row = d3.select('#risklegend').append('div');
                row.append('svg').attr('width', 35).attr('height', 16).append('line')
                    .attr('x1', 0).attr('x2', 30).attr('y1', 8).attr('y2', 8)
                    .attr('stroke', colour(strategy.id)).attr('stroke-width', 2).attr('stroke-dasharray', dash);
                row.append('span').text(strategy.label + ' — EV ' + strategy.ev.toFixed(2));
            });
          };
		  
		  self.DisplaySettings = function () {
			var modalInstance = $modal.open({
			  animation: true,
			  templateUrl: 'displaySettings.html',
			  controller: 'ModalInstanceCtrl as vm',
			  resolve:{currNode:function(){return treeData[0]}},
			});

			modalInstance.result.then(function (selectedItem) {
				main.SetupTree();
				main.RenderTree(self.currNode);
			}, function () {
			  
			});
		  };

	    self.LoadFile = function() {

	        var modalInstance = $modal.open({
	            animation: true,
	            templateUrl: 'openFile.html',
	            controller: 'ModalInstanceCtrl as vm',
	            resolve: { currNode: function () { return treeData[0] } }
	        });

	        modalInstance.result.then(function(selectedItem) {
	            if (selectedItem) {
	                var reader = new FileReader();
	                reader.onload = (function(file) {
                        return function(e) {
                            treeData = JSON.parse(e.target.result);
							treeData[0].TreeStyle=treeData[0].TreeStyle||"tree";
                            main.SetupTree();
                            main.RenderTree(treeData[0]);
                        }
	                })(selectedItem);
	                reader.readAsText(selectedItem);
	            }
	        }, function () {
			  
	        });
	    };
		  
		self.SaveFile = function (event){
		
		    var json = JSON.stringify(treeData,function( key, value) {
					if( key == 'parent') { return undefined;}
					else if( key == 'depth') { return undefined;}
					else if( key == 'x') { return undefined;}
					else if( key == 'y') { return undefined;}
					else {return value;}
					});

		    self.FileDownloader("decisiontree.tree", json, 'text/plain');

		    if (localStorage) {
		        localStorage["tree"] = json;
		    }
		};

		self.ExportImage = function (event) {
		    var xml = main.SVG().node().parentNode.parentNode.innerHTML;
		    self.FileDownloader("decisiontree.svg", xml, 'octet/stream');
	    }; 
		  
		self.NewTree = function(){
			treeData = [
				{
					"TreeStyle":"tree",
					"LineStyle":"a",
					"name": "Top Level",
					"ExpVal":null,
					"parent": "null",
					"Type":"d",
					"identifier":"1",
					"children": []
				}];
			main.SetupTree();
			main.RenderTree();
		};

		self.FileDownloader = function(fileNameToSaveAs, textToWrite, type) {
	        var ie = navigator.userAgent.match(/MSIE\s([\d.]+)/),
	            ie11 = navigator.userAgent.match(/Trident\/7.0/) && navigator.userAgent.match(/rv:11/),
	            ieEDGE = navigator.userAgent.match(/Edge/g),
	            ieVer = (ie ? ie[1] : (ie11 ? 11 : (ieEDGE ? 12 : -1)));

	        if (ie && ieVer < 10) {
	            console.log("No blobs on IE ver<10");
	            return;
	        }

	        var textFileAsBlob = new Blob([textToWrite], {
	            type: type
	        });

	        if (ieVer > -1) {
	            window.navigator.msSaveBlob(textFileAsBlob, fileNameToSaveAs);

	        } else {
	            var downloadLink = document.createElement("a");
	            downloadLink.download = fileNameToSaveAs;
	            downloadLink.href = window.URL.createObjectURL(textFileAsBlob);
	            downloadLink.onclick = function(e) { document.body.removeChild(e.target); };
	            downloadLink.style.display = "none";
	            document.body.appendChild(downloadLink);
	            downloadLink.click();
	        }
	    }
	};
	
	var ModalInstanceCtrl = function ($modalInstance, currNode) {
		this.currNode=currNode;
		this.issues = function () {
			var result = DecisionAnalysis.analyze(treeData[0]);
			return result.nodeIssues.get(currNode && currNode.data) || (result.invalid.has(currNode && currNode.data) ? ['Contains an invalid or incomplete descendant. Follow the red branches to find it.'] : []);
		};

		this.ok = function () {
			$modalInstance.close('ok');
		};

		this.SaveFile= function () {
		    $modalInstance.close(this.uploadme);
		};

		this.cancel = function () {
			$modalInstance.dismiss('cancel');
		};

		this.DeleteNode = function () {

            if(this.currNode.parent){
                var parent=this.currNode.parent;
                parent.children.splice(parent.children.indexOf(this.currNode), 1);
            }
        };
		
		this.AddChild = function () {
			main.AddChild(this.currNode);
		};
	};
	
	var app = angular.module("app",['ui.bootstrap'])
	.controller('Ctrl',ctrl)
	.controller('ModalInstanceCtrl', ModalInstanceCtrl)
	.directive("fileread", [function () {
	    return {
	        scope: {
	            fileread: "="
	        },
	        link: function (scope, element, attributes) {
	            element.bind("change", function (changeEvent) {
	                scope.$apply(function () {
	                    scope.fileread = changeEvent.target.files[0];
	                    // or all selected files:
	                    // scope.fileread = changeEvent.target.files;
	                });
	            });
	        }
	    }
	}]);

	var main = (function(){
		var height;
		var width;
		var root;
		var tree;
		var treeHeir;
		var svg;
		var i;
		var rtn = {
		    Tree: function () { return tree; },
            SVG: function() { return this.svg;  },
		    SetupD3 : function()
			{
				var margin = {top: 20, right: 120, bottom: 20, left: 120}
				this.width = 1024 - margin.right - margin.left,
				this.height = 800 - margin.top - margin.bottom;

				this.svg = d3.select("#container").append("svg")
                    .attr("version", 1.1)
		            .attr("xmlns", "http://www.w3.org/2000/svg")
			        .attr("width", this.width + margin.right + margin.left)
			        .attr("height", this.height + margin.top + margin.bottom)
                    .append("g")
					.attr("transform", "translate(" + margin.left + "," + margin.top + ")");
			},
			
			SetupTree : function(){
				this.treeHeir=null;
				this.tree = this.TreeStyle(treeData[0].TreeStyle)
					.size([this.height, this.width]);
					//.separation(function(){return 2;});

				this.root = treeData[0];
				
				this.i=this.root.maxId||0;
				this.root.maxId=this.i;
				
			},
			
			TypeToShape : function(type)
			{
				switch(type)
				{
					case "e":
						return "symbolTriangle";
					case "d":
						return "symbolSquare";
					case "c":
						return "symbolCircle";
				}
			},
			
			TypeToColour : function(type)
			{
				switch(type)
				{
					case "e":
						return "green";
					case "d":
						return "red";
					case "c":
						return "orange";
				}
			},
			
			AngleElbow : function (d) 
			{
				return "M" + (d.source.y+10) + "," + d.source.x
				+ "L" + (d.source.y+50)+","+d.target.x + "H" + d.target.y;
			},
			
			SquareElbow : function (d) 
			{
				return "M" + d.source.y + "," + d.source.x
				+ "V" + d.target.x+"H" + d.target.y;
			},
			
			Curve : function (d)
			{
				return d3.linkHorizontal()
				.x(function(d){
					return d.x;
				})
				.y(function(d){
					return d.y;
				});
			},
			
			TreeStyle:function(style)
			{
				switch(style)
				{
					case "tree":
						return d3.tree();
					case "cluster":
						return d3.cluster();
				}
			},
			
			LineStyle:function(style)
			{
				switch(style)
				{
					case "a":
						return this.AngleElbow;
					case "s":
						return this.SquareElbow;
					case "c":
						return d3.linkHorizontal()
						.x(function(d){
							return d.y;
						})
						.y(function(d){
							return d.x;
						});;
				}
			},
			
			AddChild: function (currnode) 
			{
				var self=this;
				
				if(!currnode.children){
					currnode.children=[];
				}
				
				currnode.data.Type = currnode.data.Type == "e"?"c":currnode.data.Type;

				var newNode = {
						"name": "NewNode",
						"Probability":null,
						"ExpVal":null,
						"Type":"e",
					};
					
				var datanode = GetLeafNodeByIdentifier(treeData[0], currnode.data.identifier);
				datanode.children=datanode.children||[];
				datanode.children.push(newNode);
				newNode.parent=datanode;
				newNode.identifier = datanode.identifier + "." +  datanode.children.length
	
			},

			RenderTree : function(parent) {
				var self = this;
				var analysis = DecisionAnalysis.analyze(treeData[0]);
				var marks = DecisionAnalysis.recommendations(treeData[0], analysis);
				
				
				// Compute the new tree layout.
				self.treeHeir=self.treeHeir||d3.hierarchy(self.root);
				self.treelayout=self.tree(self.treeHeir);
				const nodes = self.treelayout.descendants();
				const links = self.treelayout.links();
				//treeData=self.treeHeir;
				
				self.tree.nodes=nodes;
				self.tree.links=links;

				if(self.root.TreeStyle=="tree"){
					// Normalize for fixed-depth.
					nodes.forEach(function(d) { d.y = d.depth * 120; });
				}

				// Declare the nodes
			    var select = self.svg.selectAll("g.node");
				var node = select.data(nodes, function(d) 
						{ 
							var nodeid=d.id || (d.id = ++self.i);
							self.root.maxId=nodeid>self.root.maxId?nodeid:self.root.maxId;
							return nodeid;
						});

				// Enter the nodes.
				var nodeEnter = node.enter().append("g")
				.attr("class", "node")
				.attr("transform", function(d) { 
					return "translate(" + d.y + "," + d.x + ")"; }
				);

				nodeEnter.append('path')
				.attr("d", function(d)
				{
					return d3.symbol().size(300).type(d3[self.TypeToShape(d.data.Type)])();
				})
				.attr("transform", function(d) {
				    var transform = "translate(" + 2 + "," + -1 + ")";
					if (d.data.Type==="e")
					{
						transform = transform+" rotate(30)"; 
					}
					return transform;
				})
				.style("fill", function(d){
					return self.TypeToColour(d.data.Type);
				});

				nodeEnter.append("text")
				   .attr("class","name")
				   .attr("x", "-10")
				   .attr("y", "-10")
				   .attr("dy", ".35em")
				   .attr("text-anchor", "end")
				   .text(function (d) { return d.data.name; })
                   .style("font", "12px sans-serif")
				   .style("fill-opacity", 1);

				nodeEnter.append("text")
				   .attr("class","prob")
				   .attr("x", function(d) { return d.data.Type == "e" ? "15" : "-20"; })
				   .attr("y", function(d) { return d.data.Type == "e" ? "10" : "30"; })
				   .attr("dy", ".35em")
				   .attr("text-anchor", function (d) { return d.data.Type == "e" ? "start" : "end"; })
				   .text(function(d) { return d.data.Probability; })
				   .style("fill-opacity", 1)
                   .style("font", "12px sans-serif")
				   .style("fill","green");


				nodeEnter.append("text")
				   .attr("class","expval")
				   .attr("x", function(d) { return d.data.Type == "e" ? "15" : "-20"; })
				   .attr("y", function(d) { return d.data.Type == "e" ? "-5" : "15"; })
				   .attr("dy", ".35em")
				   .attr("text-anchor", function(d) { return d.data.Type == "e" ? "start" : "end"; })
				   .text(function (d) { return d.data.ExpVal == null ? 'Incomplete' : d.data.ExpVal; })
                   .style("font", "12px sans-serif")
				   .style("fill-opacity", 1);

				   
				nodeEnter.on("click",function(d){
					angular.element(this).scope().vm.Open(this.__data__);
				});
				
				node.select("path")
				.attr("d", function(d)
				{
					return d3.symbol().size(300).type(d3[self.TypeToShape(d.data.Type)])();
				})
				.attr("transform", function(d) {
				    var transform = "translate(" + 2 + "," + -1 + ")";
					if (d.Type==="e")
					{
						transform = transform+" rotate(30)"; 
					}
					return transform;
				})
				.style("fill", function(d){
					return self.TypeToColour(d.data.Type);
				});
				
				var nodeUpdate = node.transition();
				
				nodeUpdate.attr("transform", function(d) { 
				return "translate(" + d.y + "," + d.x + ")"; });
				
				nodeUpdate.select(".name")
						  .text(function(d) { return d.data.name; })
						  .style("fill-opacity", 1);

			    nodeUpdate.select(".prob")
                          .attr("x", function (d) { return d.data.Type == "e" ? "15" : "-20"; })
				          .attr("y", function (d) { return d.data.Type == "e" ? "10" : "30"; })
						  .text(function (d) { return d.data.Probability; })
						  .style("fill-opacity", 1);
				
			    nodeUpdate.select(".expval")
                          .attr("x", function (d) { return d.data.Type == "e" ? "15" : "-20"; })
				          .attr("y", function (d) { return d.data.Type == "e" ? "-5" : "15"; })
						  .text(function (d) { return d.data.ExpVal == null ? 'Incomplete' : d.data.ExpVal; })
						  .style("fill-opacity", 1);
						  
				node.exit().remove();

				// Declare the links
				var link = self.svg.selectAll("path.link")
				.data(links, function(d) { return d.target.id; });

				// Enter the links.
			    link.enter().insert("path", "g")
			        .attr("class", "link")
			        .attr("d", function(d){return self.LineStyle(self.root.LineStyle)(d) })
			        .style("fill", "none")
                    .style("stroke", "#ccc")
                    .style("stroke-width", "2px")
				    .style("fill-opacity", function(d) { 
					    return d.id; 
				    });

				
				link.transition()
				.attr("d", self.LineStyle(self.root.LineStyle));
				
				link.exit().remove();
				// Style the merged selections so new and edited nodes behave alike.
				var allNodes = self.svg.selectAll('g.node');
				allNodes.selectAll('title').remove();
				allNodes.append('title').text(function (d) {
					var own = analysis.nodeIssues.get(d.data) || [];
					return own.join('\n') || (analysis.invalid.has(d.data) ? 'Contains an invalid or incomplete descendant.' : (marks.get(d.data) === 'dominated' ? 'Dominated alternative: another choice has higher EV and a dominant risk profile.' : marks.get(d.data) === 'chosen' ? 'Higher EV and a dominant risk profile.' : 'Click to edit node.'));
				});
				allNodes.select('path').style('stroke', function (d) { return analysis.invalid.has(d.data) || analysis.nodeIssues.has(d.data) ? '#b00020' : null; }).style('stroke-width', 3);
				allNodes.selectAll('text').style('font-weight', function (d) { return analysis.invalid.has(d.data) || analysis.nodeIssues.has(d.data) || marks.get(d.data) === 'chosen' ? 'bold' : 'normal'; });
				allNodes.select('.name').style('fill', function (d) { return analysis.invalid.has(d.data) || analysis.nodeIssues.has(d.data) ? '#b00020' : null; });
				allNodes.selectAll('.analysis-marker').remove();
				allNodes.append('text').attr('class', 'analysis-marker').attr('x', 18).attr('y', -20).style('fill', '#b00020').style('font-weight', 'bold').text(function (d) { return analysis.invalid.has(d.data) || analysis.nodeIssues.has(d.data) ? '⚠' : ''; });
				var allLinks = self.svg.selectAll('path.link');
				allLinks.style('stroke', function (d) { return analysis.invalid.has(d.target.data) || analysis.nodeIssues.has(d.target.data) || analysis.nodeIssues.has(d.source.data) ? '#b00020' : marks.get(d.target.data) === 'chosen' ? '#222' : '#ccc'; })
					.style('stroke-width', function (d) { return analysis.invalid.has(d.target.data) || analysis.nodeIssues.has(d.target.data) || analysis.nodeIssues.has(d.source.data) || marks.get(d.target.data) === 'chosen' ? 4 : 2; });
				self.svg.selectAll('text.branch-rejection').data(links.filter(function (d) { return marks.get(d.target.data) === 'dominated'; })).join('text')
					.attr('class', 'branch-rejection').attr('x', function (d) { return (d.source.y + d.target.y) / 2; }).attr('y', function (d) { return d.target.x + 20; })
					.style('fill', '#b00020').style('font-size', '24px').style('font-weight', 'bold').text('×');
			}
		}
		rtn.SetupD3();
		rtn.SetupTree();
		rtn.RenderTree(rtn.root);
	
		return rtn;
	})();
	
	</script>
	</body>
</html>
